[project]
name = "call-me-maybe"
version = "1.0.0"
description = "Natural language to function calls with constrained decoding"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.0",
    "llm-sdk",
]

[tool.uv]
package = false

[tool.uv.sources]
llm-sdk = { path = "llm_sdk", editable = true }

[dependency-groups]
dev = [
    "flake8>=7.0",
    "mypy>=1.10",
    "pytest>=8.0",
]

[tool.mypy]
exclude = ["^llm_sdk/", "^\\.venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
